<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SoundWave Ops Challenge</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: phone-first single column, festival wristband hero, rounds as colored "stages"; admin widens to a projector board. Single bright light look by choice. */
:root{
  color-scheme: light;
  --bg:#F2F6FF;
  --card:#FFFFFF;
  --ink:#1A1442;
  --muted:#5E5A86;
  --line:#DCE1F5;
  --pink:#FF2E7E;
  --cyan:#00B4D8;
  --sun:#FFC83D;
  --orange:#FF8A1F;
  --violet:#6B4BFF;
  --lime:#5BCF4A;
  --pink-soft:#FFE3EE;
  --cyan-soft:#DDF6FC;
  --orange-soft:#FFEBD9;
  --sun-soft:#FFF4D1;
  --violet-soft:#ECE7FF;
  --ok:#1E9E4A;
  --bad:#E0245E;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:16px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap.wide{max-width:1040px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.opt:focus-within{outline:3px solid var(--violet);outline-offset:2px}

/* Hero wristband */
.hero{position:relative;background:var(--ink);color:#fff;border-radius:24px;padding:26px 20px 22px;overflow:hidden}
.hero .eyebrow{font-family:var(--f-mono);font-size:.78rem;color:var(--sun);letter-spacing:.06em}
.hero h1{font-size:clamp(1.9rem,8vw,2.9rem);font-weight:900;margin-top:8px;letter-spacing:-.01em}
.hero h1 .w{color:var(--sun)}
.hero h1 .o{display:block;font-size:.5em;font-weight:700;color:var(--cyan);margin-top:6px;letter-spacing:.04em}
.hero p{color:#D9D6FF;margin-top:12px;max-width:52ch}
.band{margin:18px -20px -22px;background:var(--pink);transform:rotate(-2deg) translateY(4px);padding:9px 0;white-space:nowrap;overflow:hidden}
.band span{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:.82rem;letter-spacing:.08em;color:#fff;animation:marq 22s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.eq{position:absolute;right:18px;top:22px;display:flex;gap:4px;align-items:flex-end;height:36px}
.eq i{width:6px;border-radius:3px;background:var(--cyan);animation:eq 1.1s ease-in-out infinite}
.eq i:nth-child(2){background:var(--sun);animation-delay:.2s}
.eq i:nth-child(3){background:var(--pink);animation-delay:.4s}
.eq i:nth-child(4){background:var(--lime);animation-delay:.1s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.band span,.eq i,.pulse{animation:none!important}}

.card{background:var(--card);border-radius:var(--r);padding:18px;border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
input[type=text],input[type=number],input[type=password],input.num{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0}
input:focus{border-color:var(--violet);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:800;font-size:1rem;background:var(--ink);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pink{background:var(--pink)}
.btn.cyan{background:var(--cyan);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.warn{background:var(--bad)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px}

.err{color:var(--bad);font-weight:600;font-size:.9rem}

/* Game top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 16px;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}
.topbar .team{font-family:var(--f-display);font-weight:700;font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.35rem;background:#2C2466;padding:4px 12px;border-radius:10px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--pink)}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tab{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;text-align:center;font-weight:800;font-size:.85rem;color:var(--ink);line-height:1.2}
.tab small{display:block;font-weight:600;font-size:.72rem;color:var(--muted);margin-top:2px}
.tab[aria-selected=true].t1{background:var(--pink);border-color:var(--pink);color:#fff}
.tab[aria-selected=true].t2{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
.tab[aria-selected=true].t3{background:var(--orange);border-color:var(--orange);color:#fff}
.tab[aria-selected=true] small{color:inherit;opacity:.85}

.stage{border-radius:var(--r);padding:18px;color:var(--ink)}
.stage.s1{background:var(--pink-soft)}
.stage.s2{background:var(--cyan-soft)}
.stage.s3{background:var(--orange-soft)}
.stage .tag{display:inline-block;font-family:var(--f-mono);font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff}
.stage p+p{margin-top:8px}

.tablewrap{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
td.n,th.n{text-align:right}
.costs{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.costs b{font-variant-numeric:tabular-nums;white-space:nowrap}

.q{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.q .qh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.q .qt{font-weight:700}
.pts{font-family:var(--f-mono);font-size:.75rem;font-weight:700;background:var(--sun-soft);color:var(--ink);padding:2px 8px;border-radius:999px;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}
.opt input{margin-top:4px;accent-color:var(--violet);width:18px;height:18px;flex:none}
.opt:has(input:checked){border-color:var(--violet);background:var(--violet-soft)}
.unit{display:flex;align-items:center;gap:8px}
.unit span{font-weight:700;color:var(--muted);white-space:nowrap}

.strat{background:#fff;border-radius:12px;padding:12px;border-left:6px solid var(--pink)}
.strat b{font-family:var(--f-display);font-size:.85rem}

.seq{display:flex;flex-direction:column;gap:8px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{height:44px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:#fff}
.slot.f{border-style:solid;border-color:var(--cyan);background:var(--cyan-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{width:46px;height:42px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-family:var(--f-display);font-weight:700}
.chip:disabled{opacity:.2}
.chip.reset{width:auto;padding:0 12px;background:transparent;color:var(--ink);border:2px solid var(--line);font-family:var(--f-body);font-size:.85rem}

.mgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.mgrid .h{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mgrid .r{font-family:var(--f-display);font-weight:700;font-size:.85rem}

.sent{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ok);border-radius:14px;padding:14px;font-weight:700;color:var(--ok)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled .q{opacity:.75}

/* Results */
.score{font-family:var(--f-display);font-weight:900;font-size:clamp(3.5rem,18vw,6rem);line-height:1;color:var(--pink)}
.code{font-family:var(--f-mono);font-weight:700;font-size:clamp(1.6rem,8vw,2.4rem);letter-spacing:.08em;background:var(--ink);color:var(--sun);padding:14px 18px;border-radius:14px;text-align:center;font-variant-numeric:tabular-nums}
.chipsrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{border-radius:12px;padding:10px;text-align:center}
.mini b{display:block;font-family:var(--f-display);font-size:1.15rem}
.mini span{font-size:.72rem;font-weight:700}

/* Admin */
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:52px minmax(0,1fr) repeat(4,64px) 82px 34px;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-variant-numeric:tabular-nums}
.brow.head{background:transparent;border:0;padding-block:0}
.brow.head div{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brow .rk{font-family:var(--f-display);font-weight:900;font-size:1.3rem}
.brow .nm{min-width:0}
.brow .nm b{font-family:var(--f-display);font-size:.95rem;display:block}
.brow .tot{font-family:var(--f-display);font-weight:900;font-size:1.25rem;text-align:right;color:var(--pink)}
.brow .c{text-align:right}
.brow.g1{border:3px solid var(--sun);background:var(--sun-soft)}
.brow.g2{border:3px solid var(--cyan)}
.brow.g3{border:3px solid var(--orange)}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem}
@media (max-width:640px){
  .brow{grid-template-columns:40px minmax(0,1fr) 70px 28px}
  .brow .c{display:none}
  .brow .rk{font-size:1.05rem}
}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

.podium{position:fixed;inset:0;z-index:20;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;width:min(900px,100%)}
.pod{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.pod .who{font-family:var(--f-display);font-weight:700;font-size:clamp(.9rem,3vw,1.5rem);min-height:3em;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transform:translateY(10px);transition:all .5s}
.pod .who small{font-family:var(--f-mono);color:var(--sun);font-size:.7em;margin-top:4px}
.pod.on .who{opacity:1;transform:none}
.pod .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:clamp(2rem,7vw,4rem);color:var(--ink)}
.pod.p1 .blk{height:min(38vh,260px);background:var(--sun)}
.pod.p2 .blk{height:min(28vh,190px);background:var(--cyan)}
.pod.p3 .blk{height:min(20vh,140px);background:var(--orange)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:21}
.sol h3{margin-top:6px}
.sol table{margin-top:6px}
.ok{color:var(--ok);font-weight:800}
</style>

<style>
.plan{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) minmax(0,1.35fr);gap:6px;align-items:center}
.plan .h{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.plan .p{font-family:var(--f-display);font-weight:700;font-size:.85rem}
.plan .dm{font-variant-numeric:tabular-nums;font-weight:700}
.plan input{padding:10px 8px;font-size:.95rem}
.formula{font-family:var(--f-mono);font-size:.8rem;background:var(--violet-soft);padding:8px 10px;border-radius:10px;overflow-x:auto;white-space:nowrap}
.cg{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;font-size:.9rem}
.cg .sym{font-family:var(--f-mono);font-weight:700;color:var(--pink)}
.brow{grid-template-columns:52px minmax(0,1fr) repeat(4,100px) 120px 34px}
.brow .tot{color:var(--violet)}
@media (max-width:640px){.brow{grid-template-columns:40px minmax(0,1fr) 104px 28px}}
.pen{font-size:.8rem;font-weight:700;color:var(--bad)}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
</style>

<body>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>

<script>
(function(){
"use strict";
const DURATION = 30*60;
const ADMIN_PIN = "2026";
const SECRET = "SW26-ASE-COST";
const KEY_TEAM = "swfest_team_v2";
const KEY_ADMIN = "swfest_admin_v2";

/* ---------- Runda 1: Berăria SoundWave (planificare agregat) ---------- */
const DEM = [60000,140000,100000,40000];
const QM = 5000, W0 = 20;
const C = {c1:2, c2:4, c3:6000, c4:8, c5:3000};
const PEN1 = 15000;

function aggCost(plan){
  let W=W0,S=0,Df=0;const rows=[];const tot={c1:0,c2:0,c3:0,c4:0,c5:0};
  plan.forEach((p,t)=>{
    const c5=Math.abs(p.W-W)*C.c5; const hired=p.W-W; W=p.W;
    const cap=W*QM;
    const c2=p.Q>cap?(p.Q-cap)*C.c2:0;
    const c3=p.Q<cap?((cap-p.Q)/QM)*C.c3:0;
    const net=S-Df+p.Q-DEM[t];
    S=net>0?net:0; Df=net<0?-net:0;
    const c1=S*C.c1, c4=Df*C.c4;
    tot.c1+=c1;tot.c2+=c2;tot.c3+=c3;tot.c4+=c4;tot.c5+=c5;
    rows.push({t:t+1,W,hired,cap,Q:p.Q,D:DEM[t],S,Df,c1,c2,c3,c4,c5,sum:c1+c2+c3+c4+c5});
  });
  tot.total=tot.c1+tot.c2+tot.c3+tot.c4+tot.c5;
  return {tot,rows};
}
const PURE = [
  {name:"Supramuncă și inactivitate", desc:"20 muncitori constant, producția = cererea", plan:[[20,60000],[20,140000],[20,100000],[20,40000]]},
  {name:"Urmărirea cererii (angajări/demiteri)", desc:"muncitori = cerere ÷ 5.000", plan:[[12,60000],[28,140000],[20,100000],[8,40000]]},
  {name:"Producția = cererea medie", desc:"20 muncitori, 85.000 L în fiecare trimestru", plan:[[20,85000],[20,85000],[20,85000],[20,85000]]}
];

/* ---------- Runda 2: Atelierul de scenotehnică (reguli de prioritate) ---------- */
const JOBS = [
  {id:"A", name:"Stand Lumina Bank", t:4, d:13},
  {id:"B", name:"Turnul Energix", t:5, d:9},
  {id:"C", name:"Cabina foto Pixo", t:1, d:2},
  {id:"D", name:"Lounge Verde Mobile", t:2, d:12},
  {id:"E", name:"Scena DJ Nordic Cola", t:6, d:19},
  {id:"F", name:"Roata Zenit Auto", t:7, d:21},
  {id:"G", name:"Bar Coral Cider", t:3, d:15}
];
const RANDOM_ORDER = "DAGCFBE";
const A_ST = 1000, B_LT = 3000, PEN2 = 10000;
const RULES = [
  {id:"FCFS", label:"Primul sosit, primul servit"},
  {id:"SLK", label:"Cea mai mică rezervă de timp"},
  {id:"SPT", label:"Cea mai mică durată a procesării"},
  {id:"ANY", label:"Oricare produs (ordinea trasă la sorți)"}
];
function ruleOrder(id){
  const ids=JOBS.map(j=>j.id), J=Object.fromEntries(JOBS.map(j=>[j.id,j]));
  if(id==="FCFS")return ids.join("");
  if(id==="ANY")return RANDOM_ORDER;
  if(id==="SPT")return ids.slice().sort((x,y)=>J[x].t-J[y].t||ids.indexOf(x)-ids.indexOf(y)).join("");
  return ids.slice().sort((x,y)=>(J[x].d-J[x].t)-(J[y].d-J[y].t)||ids.indexOf(x)-ids.indexOf(y)).join("");
}
function evalOrder(ord){
  const J=Object.fromEntries(JOBS.map(j=>[j.id,j]));let t=0,st=0,lt=0;const rows=[];
  for(const id of ord){const j=J[id];t+=j.t;const l=Math.max(0,t-j.d);st+=t;lt+=l;rows.push({id,t:j.t,d:j.d,r:j.d-j.t,ts:t,l});}
  return {rows,st,lt,avgst:st/JOBS.length,avglt:lt/JOBS.length,cost:st*A_ST+lt*B_LT};
}

/* ---------- Runda 3: Criză (servicii) ---------- */
const R3 = [
  {id:"k1", text:"Se anunță un headliner surpriză. Barurile au nevoie de 6 barmani în plus pentru weekendul festivalului.",
    opts:[["Supramuncă pentru barmanii existenți: 1.500 lei pentru fiecare barman-echivalent",9000],
          ["Angajezi 6 barmani și îi concediezi după festival: 600 lei angajare + 800 lei concediere + 1.000 lei salariu, de persoană",14400],
          ["Iei 6 temporari de la agenție: 1.800 lei de persoană",10800],
          ["Nu acoperi cererea: pierzi 4.000 de comenzi × 5 lei marjă",20000]]},
  {id:"k2", text:"Plouă două zile. Cererea la food court scade la jumătate, iar 10 lucrători nu au de lucru în acest timp.",
    opts:[["Îi concediezi și îi reangajezi după ploaie: 800 lei concediere + 600 lei angajare, de persoană",14000],
          ["Îi păstrezi pe activități auxiliare (informare, acces, curățenie): inactivitate 250 lei / lucrător / zi",5000],
          ["Îi păstrezi fără activitate și închizi standurile: 250 lei / lucrător / zi + 3.000 lei pierdere de imagine",8000]]},
  {id:"k3", text:"După festival rămân 8.000 L de bere în stoc. Următorul festival este peste 2 trimestre.",
    opts:[["Păstrezi berea în stoc: 2 lei / L / trimestru",32000],
          ["Distrugi berea: pierzi costul de producție de 6 lei / L",48000],
          ["O vinzi barurilor partenere cu reducere: pierzi 3 lei / L",24000]]},
  {id:"k4", text:"Pentru ultima zi a festivalului lipsesc 5.000 L de bere. Berea de rezervă poate fi îmbuteliată doar cu ore suplimentare.",
    opts:[["Cumperi de la altă berărie: costul deficitului, 8 lei / L",40000],
          ["Nu acoperi lipsa: pierzi 10 lei / L din marjă și imagine",50000],
          ["Supramuncă la berărie: 4 lei / L",20000]]}
];
const R3_MIN = 9000+5000+24000+20000;

const BONUS_PER_MIN = 500, BONUS_MAX_MIN = 20;

/* ---------- Utilitare ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const app = $("#app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const lei = n => Math.round(n).toLocaleString("ro-RO");
function parseLei(s){const d=String(s==null?"":s).replace(/[^\d]/g,"");return d?Number(d):NaN;}
function parseDec(s){let t=String(s==null?"":s).trim().replace(/\s/g,"");if(!t)return NaN;if(t.includes(",")&&t.includes("."))t=t.replace(/\./g,"");t=t.replace(",",".");return Number(t);}
function dec2(x){return (Math.round(x*100)/100).toFixed(2).replace(".",",");}
function mmss(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");}

/* ---------- Cod de verificare (BigInt, 60 biți, base32 Crockford) ---------- */
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
const LIM={r1:131071,r2:4095,r3:2047,b:31};
function encodeCode(team,r1,r2,r3,bmin){
  const u1=Math.min(LIM.r1,Math.round(r1/100)),u2=Math.min(LIM.r2,Math.round(r2/100)),u3=Math.min(LIM.r3,Math.round(r3/100));
  let P=BigInt(team);
  P=(P<<17n)|BigInt(u1);P=(P<<12n)|BigInt(u2);P=(P<<11n)|BigInt(u3);P=(P<<5n)|BigInt(bmin);
  const chk=BigInt(fnv(SECRET+"|"+P.toString())%512);
  let N=(P<<9n)|chk,out="";
  for(let i=0;i<12;i++){out=B32[Number(N&31n)]+out;N>>=5n;}
  return out.slice(0,4)+"-"+out.slice(4,8)+"-"+out.slice(8);
}
function decodeCode(raw){
  const s=String(raw||"").toUpperCase().replace(/[\s-]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
  if(s.length!==12)return null;
  let N=0n;for(const ch of s){const v=B32.indexOf(ch);if(v<0)return null;N=(N<<5n)|BigInt(v);}
  const chk=Number(N&511n);let P=N>>9n;
  if(fnv(SECRET+"|"+P.toString())%512!==chk)return null;
  const bmin=Number(P&31n);P>>=5n;
  const u3=Number(P&2047n);P>>=11n;
  const u2=Number(P&4095n);P>>=12n;
  const u1=Number(P&131071n);const team=Number(P>>17n);
  if(team<1||team>60||bmin>BONUS_MAX_MIN)return null;
  const r1=u1*100,r2=u2*100,r3=u3*100,bonus=bmin*BONUS_PER_MIN;
  return {team,r1,r2,r3,bonus,total:r1+r2+r3-bonus};
}

/* ---------- Calculul costului echipei ---------- */
function teamPlan(a){
  let prev=W0;const plan=[];
  for(let t=1;t<=4;t++){
    let W=parseInt(String(a["w"+t]||"").replace(/[^\d]/g,""),10);if(isNaN(W))W=prev;W=Math.min(200,Math.max(0,W));
    let Q=parseLei(a["q"+t]);if(isNaN(Q))Q=0;Q=Math.min(2000000,Q);
    plan.push({W,Q});prev=W;
  }
  return plan;
}
function scoreR1(a){
  const p=PURE[a.strat]||PURE[2];
  const r=aggCost(p.plan.map(([W,Q])=>({W,Q})));let errs=0;
  for(const k of ["c1","c2","c3","c4","c5","total"]){const v=parseLei(a["k_"+k]);if(isNaN(v)||Math.abs(v-r.tot[k])>50)errs++;}
  return {base:r.tot.total,errs,cost:r.tot.total+errs*PEN1};
}
function scoreR2(a){
  const rule=RULES[a.rule]?RULES[a.rule].id:"ANY";
  const ord=ruleOrder(rule), ev=evalOrder(ord);let errs=0;
  if((a.seq||"")!==ord)errs++;
  const chk=(k,exp,tol)=>{const v=parseDec(a[k]);if(isNaN(v)||Math.abs(v-exp)>tol)errs++;};
  chk("st",ev.st,0.01);chk("lt",ev.lt,0.01);chk("avgst",ev.avgst,0.011);chk("avglt",ev.avglt,0.011);
  {const v=parseLei(a.cost);if(isNaN(v)||v!==ev.cost)errs++;}
  return {base:ev.cost,errs,cost:ev.cost+errs*PEN2,rule};
}
function scoreR3(a){
  let s=0;for(const q of R3){const i=a[q.id];s+= (i!==undefined&&q.opts[i])?q.opts[i][1]:Math.max(...q.opts.map(o=>o[1]));}
  return {base:s,errs:0,cost:s};
}

function missing(r){
  const a=S.a;
  if(r===1&&a.strat===undefined)return "Alegeți o strategie de planificare agregat.";
  if(r===2&&a.rule===undefined)return "Alegeți o regulă de prioritate.";
  if(r===3&&R3.some(q=>a[q.id]===undefined))return "Alegeți o variantă pentru fiecare situație.";
  return "";
}
function keepScroll(){const y=window.scrollY;renderGame();window.scrollTo(0,y);}
function lockRound(r){
  if(S.sent["r"+r])return;
  S.sent["r"+r]=true;
  S.res["r"+r]= r===1?scoreR1(S.a): r===2?scoreR2(S.a): scoreR3(S.a);
  persist();
}
function finish(early){
  [1,2,3].forEach(lockRound);
  S.bmin= early? Math.max(0,Math.min(BONUS_MAX_MIN,Math.floor(remaining()/60))) : 0;
  S.done=true;persist();stopTick();renderResults();
}
function startTick(){
  stopTick();

    if(t){t.textContent=mmss(rem);t.classList.toggle("low",rem<=300);t.classList.toggle("pulse",rem<=60);}

    <div class="card stack" style="text-align:center;align-items:center">
      <div class="label">Costul total al echipei</div>
      <div class="score" style="font-size:clamp(2.4rem,12vw,4.2rem);color:var(--violet)">${lei(total)} <span style="font-size:.4em">lei</span></div>
      <div class="muted small">Un cost mai mic înseamnă un loc mai bun în clasament.</div>
    </div>
    <div class="chipsrow">
      <div class="mini" style="background:var(--pink-soft)"><span>Berea</span><b style="font-size:.95rem">${lei(r1)}</b></div>
      <div class="mini" style="background:var(--cyan-soft)"><span>Atelierul</span><b style="font-size:.95rem">${lei(r2)}</b></div>
      <div class="mini" style="background:var(--orange-soft)"><span>Criză</span><b style="font-size:.95rem">${lei(r3)}</b></div>
      <div class="mini" style="background:var(--sun-soft)"><span>Bonus</span><b style="font-size:.95rem">−${lei(b)}</b></div>
    </div>
    ${errs?`<p class="pen" style="text-align:center">Costurile includ penalizări pentru ${errs} ${errs===1?"calcul greșit":"calcule greșite"}.</p>`:`<p class="ok small" style="text-align:center">Toate calculele raportate au fost corecte.</p>`}
    <div class="card stack">
      <div class="label">Codul echipei, pentru profesor</div>
      <div class="code">${code}</div>
      <p class="small muted">Arătați acest cod profesorului. El conține numărul echipei și costurile, deci nu poate fi modificat.</p>
    </div>
    <div class="card stack small"><div class="label">Membri</div><p>${S.members.map(esc).join(" · ")}</p></div>
    <p class="small muted" style="text-align:center">Soluțiile le discutăm împreună, după clasament.</p>
  </div>`;
}

/* ---------- Admin ---------- */
let A=load(KEY_ADMIN)||{entries:[]};
let showSol=false,wipeConfirm=false;
function persistA(){save(KEY_ADMIN,A);}
function ranked(){return [...A.entries].sort((x,y)=>x.total-y.total||y.bonus-x.bonus||x.team-y.team);}

function renderAdmin(){
  stopTick();
  if(!adminOK){
    app.innerHTML=`<div class="wrap stack" style="max-width:440px">
      <section class="hero"><div class="eyebrow">ZONA PROFESORULUI</div><h1 style="font-size:1.5rem">Clasament SoundWave</h1><div class="band" aria-hidden="true"><span>ADMIN · CLASAMENT · PODIUM · SOLUȚII · ADMIN · CLASAMENT · PODIUM · SOLUȚII · </span></div></section>
      <form class="card stack" id="pinForm"><div class="field"><label for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" autocomplete="off"></div>
      <div class="err" id="pinErr" hidden>PIN greșit.</div><button class="btn block" type="submit">Intră</button></form>
      <div style="text-align:center"><button class="link" id="back" type="button">Înapoi la joc</button></div></div>`;
    $("#pinForm").onsubmit=e=>{e.preventDefault();if($("#pin").value===ADMIN_PIN){adminOK=true;renderAdmin();}else $("#pinErr").hidden=false;};
    $("#back").onclick=goGame;return;
  }
  const list=ranked();
  const rows=list.map((e,i)=>`<div class="brow ${i<3?'g'+(i+1):''}">
      <div class="rk">${i+1}</div>
      <div class="nm"><b>Echipa ${e.team}</b><span class="small muted">${esc(e.name||"")}</span></div>
      <div class="c">${lei(e.r1)}</div><div class="c">${lei(e.r2)}</div><div class="c">${lei(e.r3)}</div><div class="c">−${lei(e.bonus)}</div>
      <div class="tot">${lei(e.total)}</div>
      <button class="x" data-del="${e.team}" aria-label="Șterge echipa ${e.team}">×</button></div>`).join("");
  app.innerHTML=`<div class="wrap wide stack">
    <div class="row" style="justify-content:space-between">
      <h1 style="font-size:clamp(1.3rem,4vw,2rem)"><span style="color:var(--pink)">SoundWave</span> · Clasament</h1>
      <div class="row"><button class="btn sun" id="podBtn" type="button" ${list.length?"":"disabled"}>Podium</button>
        <button class="btn ghost" id="solBtn" type="button">${showSol?"Ascunde soluțiile":"Soluții"}</button></div>
    </div>
    <form class="card row" id="addForm" style="align-items:flex-end">
      <div class="field" style="flex:2 1 240px"><label for="codeIn">Codul echipei</label><input type="text" id="codeIn" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" style="font-family:var(--f-mono);letter-spacing:.06em"></div>
      <div class="field" style="flex:1 1 160px"><label for="nameIn">Nume echipă (opțional)</label><input type="text" id="nameIn" maxlength="28" autocomplete="off"></div>
      <button class="btn pink" type="submit">Adaugă</button>
      <div id="addMsg" class="small" style="flex-basis:100%" hidden></div>
    </form>
    ${list.length?`<div class="board"><div class="brow head"><div>Loc</div><div>Echipa</div><div class="c">Berea</div><div class="c">Atelierul</div><div class="c">Criză</div><div class="c">Bonus</div><div style="text-align:right">Cost total</div><div></div></div>${rows}</div>`
      :`<div class="empty">Clasamentul apare aici, ordonat de la cel mai scăzut cost la cel mai ridicat. Introduceți codurile afișate pe telefoanele echipelor la final.</div>`}
    ${showSol?solutionsHTML():""}
    <div class="row" style="justify-content:space-between">
      <button class="link" id="back" type="button">Înapoi la joc</button>
      <button class="btn ${wipeConfirm?'warn':'ghost'}" id="wipe" type="button">${wipeConfirm?"Confirmați ștergerea clasamentului":"Golește clasamentul"}</button>
    </div>
  </div>`;
  $("#addForm").onsubmit=e=>{
    e.preventDefault();
    const d=decodeCode($("#codeIn").value);
    if(!d){const m=$("#addMsg");m.innerHTML=`<span class="err">Cod invalid. Verificați cele 12 caractere.</span>`;m.hidden=false;return;}
    const name=$("#nameIn").value.trim(),ex=A.entries.find(x=>x.team===d.team);
    A.entries=A.entries.filter(x=>x.team!==d.team);A.entries.push({...d,name:name||(ex&&ex.name)||""});
    persistA();wipeConfirm=false;renderAdmin();
    const m=$("#addMsg");m.innerHTML=`<span class="ok">Echipa ${d.team} adăugată: ${lei(d.total)} lei${ex?" (înlocuită)":""}.</span>`;m.hidden=false;$("#codeIn").focus();
  };
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{A.entries=A.entries.filter(x=>x.team!==Number(b.dataset.del));persistA();renderAdmin();});
  $("#solBtn").onclick=()=>{showSol=!showSol;renderAdmin();};
  $("#podBtn").onclick=showPodium;$("#back").onclick=goGame;
  $("#wipe").onclick=()=>{if(!wipeConfirm){wipeConfirm=true;renderAdmin();return;}A={entries:[]};persistA();wipeConfirm=false;renderAdmin();};
}

function aggTable(plan){
  const r=aggCost(plan.map(([W,Q])=>({W,Q})));
  return `<div class="tablewrap"><table><thead><tr><th>Trim.</th><th class="n">Qd</th><th class="n">Muncitori</th><th class="n">Capacitate</th><th class="n">Qs</th><th class="n">Stoc</th><th class="n">Deficit</th><th class="n">c1</th><th class="n">c2</th><th class="n">c3</th><th class="n">c4</th><th class="n">c5</th><th class="n">Total</th></tr></thead><tbody>
   ${r.rows.map(x=>`<tr><td>T${x.t}</td><td class="n">${lei(x.D)}</td><td class="n">${x.W}${x.hired?` (${x.hired>0?"+":""}${x.hired})`:""}</td><td class="n">${lei(x.cap)}</td><td class="n">${lei(x.Q)}</td><td class="n">${lei(x.S)}</td><td class="n">${lei(x.Df)}</td><td class="n">${lei(x.c1)}</td><td class="n">${lei(x.c2)}</td><td class="n">${lei(x.c3)}</td><td class="n">${lei(x.c4)}</td><td class="n">${lei(x.c5)}</td><td class="n">${lei(x.sum)}</td></tr>`).join("")}
   <tr><td colspan="7"><b>Total</b></td><td class="n"><b>${lei(r.tot.c1)}</b></td><td class="n"><b>${lei(r.tot.c2)}</b></td><td class="n"><b>${lei(r.tot.c3)}</b></td><td class="n"><b>${lei(r.tot.c4)}</b></td><td class="n"><b>${lei(r.tot.c5)}</b></td><td class="n"><b class="ok">${lei(r.tot.total)}</b></td></tr>
  </tbody></table></div>`;
}
function runCalc(){
  const plan=[1,2,3,4].map(t=>{let W=parseInt($("#cw"+t).value,10);let Q=parseLei($("#cq"+t).value);return [isNaN(W)?0:W,isNaN(Q)?0:Q];});
  $("#calcOut").innerHTML=aggTable(plan);
}
function solutionsHTML(){
  const pure=PURE.map(p=>`<div class="card stack" style="gap:6px;min-width:0"><h3>${p.name}</h3><p class="small muted">${p.desc}</p>${aggTable(p.plan)}</div>`).join("");
  const rules=RULES.map(r=>{const ord=ruleOrder(r.id),ev=evalOrder(ord);
    return `<div class="card" style="min-width:0"><h3>${r.label}</h3><p class="small muted" style="margin-top:4px">Ordinea: ${ord.split("").join(" → ")}</p><div class="tablewrap"><table>
     <thead><tr><th>Produs</th><th class="n">Tp</th><th class="n">Dp</th><th class="n">Rezervă</th><th class="n">Ts</th><th class="n">Întârziere</th></tr></thead>
     <tbody>${ev.rows.map(x=>`<tr><td>${x.id}</td><td class="n">${x.t}</td><td class="n">${x.d}</td><td class="n">${x.r}</td><td class="n">${x.ts}</td><td class="n">${x.l}</td></tr>`).join("")}
     <tr><td colspan="4"><b>Total</b></td><td class="n"><b>${ev.st}</b></td><td class="n"><b>${ev.lt}</b></td></tr></tbody></table></div>
     <p class="small" style="margin-top:6px">Timp mediu în atelier <b>${dec2(ev.avgst)}</b> zile · Timp mediu de întârziere <b>${dec2(ev.avglt)}</b> zile<br>Cost = 1.000 × ${ev.st} + 3.000 × ${ev.lt} = <b>${lei(ev.cost)} lei</b></p></div>`;}).join("");
  return `<section class="stack sol">
    <h2 style="color:var(--pink)">Soluții · Runda 1 · SoundWave Brew</h2>
    <p class="small">Strategia cu cel mai scăzut cost este urmărirea cererii prin angajări și demiteri: 132.000 lei.</p>
    <div class="stack">${pure}</div>
    <h2 style="color:var(--cyan)">Soluții · Runda 2 · Atelierul</h2>
    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))">${rules}</div>
    <div class="card small"><p>Cea mai mică durată a procesării dă cel mai mic timp de staționare, dar cea mai mică rezervă de timp reduce mult întârzierile. La 3.000 lei pe zi de întârziere, rezerva minimă câștigă: 120.000 lei, față de 129.000 lei.</p></div>
    <h2 style="color:var(--orange)">Soluții · Runda 3 · Criză</h2>
    <div class="card small stack" style="gap:6px">
      ${R3.map(q=>{const best=q.opts.reduce((m,o)=>o[1]<m[1]?o:m);return `<p><b>${esc(q.text)}</b><br>${q.opts.map(o=>`${lei(o[1])} lei${o===best?" ✓":""}`).join(" · ")}</p>`;}).join("")}
      <p>Cost minim posibil în Runda 3: <b>${lei(R3_MIN)} lei</b>.</p>
    </div>
  </section>`;
}

function showPodium(){
  const list=ranked().slice(0,3);
  const ov=document.createElement("div");ov.className="podium";
  const pod=(i,cls)=>{const e=list[i];return `<div class="pod ${cls}" data-i="${i}"><div class="who">${e?`Echipa ${e.team}${e.name?`<span style="font-size:.7em;color:#D9D6FF">${esc(e.name)}</span>`:""}<small>${lei(e.total)} lei</small>`:"—"}</div><div class="blk">${i+1}</div></div>`;};
  ov.innerHTML=`<div class="label" style="color:var(--sun)">SOUNDWAVE FEST · COST MINIM CÂȘTIGĂ</div>
    <div class="pods">${pod(1,"p2")}${pod(0,"p1")}${pod(2,"p3")}</div>
    <div class="row" style="justify-content:center"><button class="btn sun" id="rev" type="button">Dezvăluie locul ${Math.min(3,list.length)}</button><button class="btn ghost" id="cls" type="button" style="color:#fff">Închide</button></div>`;
  document.body.appendChild(ov);
  let step=Math.min(3,list.length)-1;const rev=$("#rev",ov);
  rev.onclick=()=>{if(step<0)return;ov.querySelector(`.pod[data-i="${step}"]`).classList.add("on");
    if(step===0){confetti();rev.hidden=true;}step--;if(step>=0)rev.textContent=`Dezvăluie locul ${step+1}`;};
  $("#cls",ov).onclick=()=>{ov.remove();stopConfetti();};
}

/* ---------- Confetti ---------- */
let confRAF=null;
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti");c.hidden=false;const ctx=c.getContext("2d");const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=["#FF2E7E","#00B4D8","#FFC83D","#FF8A1F","#6B4BFF","#5BCF4A"];
  const P=Array.from({length:180},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    t++;if(t<360)confRAF=requestAnimationFrame(f);else stopConfetti();})();
}
function stopConfetti(){if(confRAF)cancelAnimationFrame(confRAF);confRAF=null;const c=$("#confetti");c.getContext("2d").clearRect(0,0,c.width,c.height);c.hidden=true;}

/* ---------- Navigare ---------- */
function goGame(){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}route(true);}
function route(forceGame){
  if(!forceGame&&location.hash==="#admin"){renderAdmin();return;}
  if(S&&S.team){if(!S.done&&remaining()<=0){finish(false);return;}renderGame();}
  else renderStart();
}
window.addEventListener("hashchange",()=>route(false));
if(typeof module!=="undefined")module.exports={aggCost,scoreR1,scoreR2,scoreR3,encodeCode,decodeCode,ruleOrder,evalOrder,PURE};
else route(false);
})();
</script>
